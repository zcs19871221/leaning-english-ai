<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>英语单词复习</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
    
    /* Tab 样式 */
    .tab-bar {
      display: flex;
      border-bottom: 2px solid #4d90fe;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 12px 24px;
      font-size: 16px;
      background: #f5f5f5;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 6px 6px 0 0;
      margin-right: 4px;
    }
    .tab-btn:hover { background: #e0e0e0; }
    .tab-btn.active {
      background: #4d90fe;
      color: #fff;
    }
    .tab-count {
      font-size: 12px;
      background: rgba(0,0,0,0.15);
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
    }
    
    /* 分组样式 */
    .group {
      margin-bottom: 16px;
      padding: 12px;
      background: #fafafa;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .group.new-group {
      background: #fff3cd;
      border: 2px solid #ffc107;
    }
    .word-btn {
      display: inline-block;
      padding: 8px 18px;
      background: #eee;
      border: 1px solid #ccc;
      border-radius: 6px;
      cursor: pointer;
      min-width: 80px;
      text-align: center;
      transition: background 0.2s;
      user-select: text;  /* 改为 text，允许选中文本 */
    }
    .word-btn.revealed {
      background: #d1e7dd;
      color: #222;
      border-color: #bcd0c7;
    }
    .word-btn.masked {
      background: #666;
      color: #666;
      letter-spacing: 2px;
    }
    
    /* 操作按钮 */
    .action-btn {
      padding: 6px 14px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 4px;
    }
    .action-btn.complete { background: #28a745; color: #fff; }
    .action-btn.complete:hover { background: #218838; }
    .action-btn.forget { background: #dc3545; color: #fff; }
    .action-btn.forget:hover { background: #c82333; }
    
    /* Tab 内容 */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 16px;
    }
    
    /* 测试结果 */
    #test-results {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 8px;
      display: none;
    }
    #test-results.show { display: block; }
    .test-pass { color: #28a745; }
    .test-fail { color: #dc3545; }
  </style>
</head>
<body>
  <h1>📚 英语单词复习</h1>
  
  <div style="margin-bottom: 15px;">
    <button onclick="hideAllWords()" style="padding: 8px 16px; font-size: 14px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
      🔒 隐藏全部
    </button>
  </div>
  
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="default">
      待复习 <span class="tab-count" id="count-default">0</span>
    </button>
    <button class="tab-btn" data-tab="complete">
      已完成 <span class="tab-count" id="count-complete">0</span>
    </button>
    <button class="tab-btn" data-tab="forgotten">
      忘记 <span class="tab-count" id="count-forgotten">0</span>
    </button>
    <button class="tab-btn" data-tab="test" style="margin-left: auto; background: #ffc107;">
      🧪 测试
    </button>
  </div>
  
  <div id="tab-default" class="tab-content active"></div>
  <div id="tab-complete" class="tab-content"></div>
  <div id="tab-forgotten" class="tab-content"></div>
  <div id="tab-test" class="tab-content">
    <button onclick="runTests()" style="padding: 10px 20px; font-size: 16px;">运行单元测试</button>
    <div id="test-results"></div>
  </div>

  <script>
    // ==================== 数据定义 ====================
    const defaultWordGroups = [

      ["alien", "ally"],
      ["billow", "blow"],
      ["serenity", "serene"],
      ["hushed", "hustled"],
      ["deck", "desk", "dock"],
      ["cedar", "cider"],
      ["strap", "strip", "stride", "string"],
      ["tilt", "lilt"],
      ["pinnacle", "barnacle"],
      ["crest", "crescent"],
      ["chill", "chilly"],
      ["cranial", "crane"],
      ["scorch", "scour"],
      ["shuffle", "commute", "shuttle"],
      ["joint", "jolt"],
      ["bend", "blend"],
      ["founder", "funder", "fund", "found", "find"],
      ["reverse", "revert"],
      ["compete", "complete"],
      ["brake", "bake"],
      ["creative", "intellectual", "innovative", "ingenuity"],
      ["capital", "capita"],
      ["nocturnal", "necropolis"],
      ["pitch", "ditch"],
      ["lick", "flick"],
      ["mood", "moor"],
      ["glacier", "glacial"],
      ["yurt", "yacht"],
      ["gaze", "glaze"],
      ["interference", "intervening", "intervene"],
      ["raven", "ravine"],
      ["roar", "roam"],
      ["affront", "confront", "comfort"],
      ["sign", "sigh"],
      ["tense", "intense"],
      ["visualize", "vision"],
      ["comprehensive", "comprehension"],
      ["prior", "priority"],
      ["isolated", "insulated"],
      ["bath", "bathe"],
      ["radical", "radiate"],
      ["plate", "platter", "tray"],
      ["picky", "prick"],
      ["complain", "comply", "comprise"],
      ["runway", "runaway"],
      ["tuxedo", "detox", "toxic"],
      ["toll", "tow", "toe"],
      ["tycoon", "magnate", "mogul", "magnet"],
      ["tick", "ticket"],
      ["squad", "squid"],
      ["synonym", "synonymous"],
      ["thrive", "strive"],
      ["ceremony", "cemetery"],
      ["grin", "grind"],
      ["illuminate", "illusion"],
      ["haunt", "haul", "hound"],
      ["diesel", "kerosene", "petrol", "patrol"],
      ["entwined", "intertwined"],
      ["spectrum", "spectre"],
      ["repute", "dispute", "deputy"],
      ["sturdy", "steady"],
      ["helm", "helmet", "hamlet"],
      ["lurk", "lurch"],
      ["crater", "crate", "cater"],
      ["iron", "steel", "copper", "aluminium"]
    ];

    const STORAGE_KEY = 'englishWordReview_v3';

    // ==================== 工具函数 ====================
    
    /**
     * Fisher-Yates 洗牌算法
     * @param {Array} arr - 要洗牌的数组
     * @returns {Array} - 洗牌后的新数组
     */
    function shuffleArray(arr) {
      const result = [...arr];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    /**
     * 生成组的唯一标识符（基于排序后的单词列表）
     * @param {Array} words - 单词数组
     * @returns {string} - 唯一标识符
     */
    function generateGroupKey(words) {
      return [...words].sort().join('|').toLowerCase().trim();
    }

    /**
     * 检查两个组是否有交集
     * @param {Array} group1 - 第一个单词组
     * @param {Array} group2 - 第二个单词组
     * @returns {boolean}
     */
    function hasOverlap(group1, group2) {
      const set = new Set(group2.map(w => w.toLowerCase().trim()));
      return group1.some(w => set.has(w.toLowerCase().trim()));
    }

    /**
     * 选中元素中的文本
     * @param {HTMLElement} el - 要选中文本的元素
     */
    function selectElementText(el) {
      if (!el) return;
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    /**
     * 根据 defaultWordGroups 的顺序获取组的原始索引
     * @param {Array} words - 单词数组
     * @returns {number} - 在 defaultWordGroups 中的索引，未找到返回 -1
     */
    function getDefaultGroupIndex(words) {
      const key = generateGroupKey(words);
      return defaultWordGroups.findIndex(g => generateGroupKey(g) === key);
    }

    // ==================== 状态管理 ====================
    
    let state = {
      default: [],    // 待复习：[{ words: [...], revealed: [...], originalIndex: number, isNew: boolean }, ...]
      complete: [],   // 已完成
      forgotten: []   // 忘记
    };

    /**
     * 从 localStorage 加载状态
     * @returns {Object} - 加载的状态
     */
    function loadState() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (data && data.default && data.complete && data.forgotten) {
          return data;
        }
      } catch (e) {
        console.error('加载状态失败:', e);
      }
      return { default: [], complete: [], forgotten: [] };
    }

    /**
     * 保存状态到 localStorage
     */
    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    /**
     * 创建一个新的组项目
     * @param {Array} words - 单词数组
     * @param {number} originalIndex - 在 defaultWordGroups 中的原始索引
     * @param {boolean} isNew - 是否是新增或修改的组
     * @returns {Object} - 组项目对象
     */
    function createGroupItem(words, originalIndex, isNew = false) {
      return {
        words: [...words],
        revealed: words.map(() => false),
        originalIndex: originalIndex,
        isNew: isNew,
        shuffledOrder: shuffleArray([...Array(words.length).keys()])
      };
    }

    /**
     * 同步 defaultWordGroups 与当前状态
     * - 新增的组放到 default 队列顶部，标记为 isNew
     * - 修改的组（有交集但内容变化）移到 default 队列顶部，标记为 isNew
     * - 删除的组从所有队列中移除
     * - 保持行的顺序按照 originalIndex 排序（新增/修改的除外，它们在顶部）
     */
    function syncWithDefaultGroups() {
      const defaultKeys = new Set(defaultWordGroups.map(g => generateGroupKey(g)));
      
      // 收集需要放到顶部的组（新增或修改的）
      const topGroups = [];
      
      // 1. 处理 complete 中的组
      state.complete = state.complete.filter(item => {
        const key = generateGroupKey(item.words);
        const exactMatch = defaultKeys.has(key);
        const hasMatch = defaultWordGroups.some(dg => hasOverlap(item.words, dg));
        
        if (!hasMatch) {
          // 完全不在 default 中，删除
          return false;
        }
        if (!exactMatch && hasMatch) {
          // 有交集但不完全匹配，说明被修改，移到 default 顶部
          const newVersion = defaultWordGroups.find(dg => hasOverlap(item.words, dg));
          if (newVersion) {
            const idx = defaultWordGroups.indexOf(newVersion);
            topGroups.push(createGroupItem(newVersion, idx, true));
          }
          return false;
        }
        // 更新 originalIndex
        item.originalIndex = defaultWordGroups.findIndex(dg => generateGroupKey(dg) === key);
        return true;
      });
      
      // 2. 处理 forgotten 中的组
      state.forgotten = state.forgotten.filter(item => {
        const key = generateGroupKey(item.words);
        const exactMatch = defaultKeys.has(key);
        const hasMatch = defaultWordGroups.some(dg => hasOverlap(item.words, dg));
        
        if (!hasMatch) {
          return false;
        }
        if (!exactMatch && hasMatch) {
          const newVersion = defaultWordGroups.find(dg => hasOverlap(item.words, dg));
          if (newVersion) {
            const idx = defaultWordGroups.indexOf(newVersion);
            topGroups.push(createGroupItem(newVersion, idx, true));
          }
          return false;
        }
        item.originalIndex = defaultWordGroups.findIndex(dg => generateGroupKey(dg) === key);
        return true;
      });
      
      // 3. 处理 default 中的组
      state.default = state.default.filter(item => {
        const key = generateGroupKey(item.words);
        const exactMatch = defaultKeys.has(key);
        const hasMatch = defaultWordGroups.some(dg => hasOverlap(item.words, dg));
        
        if (!hasMatch) {
          return false;
        }
        if (!exactMatch && hasMatch) {
          // 被修改，更新内容并标记为新
          const newVersion = defaultWordGroups.find(dg => hasOverlap(item.words, dg));
          if (newVersion) {
            const idx = defaultWordGroups.indexOf(newVersion);
            topGroups.push(createGroupItem(newVersion, idx, true));
          }
          return false;
        }
        // 更新 originalIndex，清除 isNew 标记
        item.originalIndex = defaultWordGroups.findIndex(dg => generateGroupKey(dg) === key);
        item.isNew = false;
        return true;
      });
      
      // 4. 找出需要新增的组
      const allExistingKeys = new Set([
        ...state.default.map(item => generateGroupKey(item.words)),
        ...state.complete.map(item => generateGroupKey(item.words)),
        ...state.forgotten.map(item => generateGroupKey(item.words)),
        ...topGroups.map(item => generateGroupKey(item.words))
      ]);
      
      for (let i = 0; i < defaultWordGroups.length; i++) {
        const group = defaultWordGroups[i];
        const key = generateGroupKey(group);
        if (!allExistingKeys.has(key)) {
          // 检查是否与现有组有交集
          const hasOverlapWithExisting = [...state.default, ...state.complete, ...state.forgotten, ...topGroups]
            .some(item => hasOverlap(item.words, group));
          
          if (!hasOverlapWithExisting) {
            topGroups.push(createGroupItem(group, i, true));
          }
        }
      }
      
      // 5. 按 originalIndex 排序 default 中的非新组
      state.default.sort((a, b) => a.originalIndex - b.originalIndex);
      
      // 6. 将新增/修改的组放到顶部（按 originalIndex 排序）
      topGroups.sort((a, b) => a.originalIndex - b.originalIndex);
      state.default = [...topGroups, ...state.default];
      
      saveState();
    }

    // ==================== 组操作函数 ====================

    /**
     * 隐藏当前标签页所有单词
     */
    function hideAllWords() {
      const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
      if (activeTab === 'test') return;
      
      state[activeTab].forEach(item => {
        item.revealed = item.words.map(() => false);
      });
      saveState();
      render();
    }

    /**
     * 显示单词（取消遮挡）
     * @param {string} tab - 标签页名称
     * @param {number} groupIndex - 组索引
     * @param {number} wordIndex - 单词索引
     */
    function revealWord(tab, groupIndex, wordIndex) {
      state[tab][groupIndex].revealed[wordIndex] = true;
      saveState();
      render();
    }

    /**
     * 隐藏单词（重新遮挡）
     * @param {string} tab - 标签页名称
     * @param {number} groupIndex - 组索引
     * @param {number} wordIndex - 单词索引
     */
    function hideWord(tab, groupIndex, wordIndex) {
      state[tab][groupIndex].revealed[wordIndex] = false;
      saveState();
      render();
    }

    /**
     * 将组移动到"已完成"
     */
    function moveToComplete(fromTab, groupIndex) {
      const [item] = state[fromTab].splice(groupIndex, 1);
      item.revealed = item.words.map(() => false);
      item.isNew = false;
      item.shuffledOrder = shuffleArray([...Array(item.words.length).keys()]); // 重新生成顺序
      state.complete.push(item);
      state.complete.sort((a, b) => a.originalIndex - b.originalIndex);
      saveState();
      render();
    }

    /**
     * 将组移动到"忘记"
     */
    function moveToForgotten(fromTab, groupIndex) {
      const [item] = state[fromTab].splice(groupIndex, 1);
      item.revealed = item.words.map(() => false);
      item.isNew = false;
      item.shuffledOrder = shuffleArray([...Array(item.words.length).keys()]); // 重新生成顺序
      state.forgotten.push(item);
      state.forgotten.sort((a, b) => a.originalIndex - b.originalIndex);
      saveState();
      render();
    }

    /**
     * 将组移回"待复习"
     */
    function moveToDefault(fromTab, groupIndex) {
      const [item] = state[fromTab].splice(groupIndex, 1);
      item.revealed = item.words.map(() => false);
      item.isNew = false;
      item.shuffledOrder = shuffleArray([...Array(item.words.length).keys()]); // 重新生成顺序
      
      let insertIndex = state.default.findIndex(g => !g.isNew && g.originalIndex > item.originalIndex);
      if (insertIndex === -1) {
        insertIndex = state.default.length;
      }
      state.default.splice(insertIndex, 0, item);
      
      saveState();
      render();
    }

    // ==================== 渲染函数 ====================

    /**
     * 获取组内单词的随机顺序（每次渲染重新生成）
     * @param {number} length - 单词数量
     * @returns {Array} - 随机顺序的索引数组
     */
    function getShuffledOrder(length) {
      return shuffleArray([...Array(length).keys()]);
    }

    /**
     * 渲染单个组
     * @param {Object} item - 组项目
     * @param {string} tab - 标签页名称
     * @param {number} groupIndex - 组索引
     * @returns {HTMLElement}
     */
    function renderGroup(item, tab, groupIndex) {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'group' + (item.isNew ? ' new-group' : '');
      
      const allRevealed = item.revealed.every(r => r);
      
      // 使用保存的随机顺序，如果没有则生成（兼容旧数据）
      if (!item.shuffledOrder || item.shuffledOrder.length !== item.words.length) {
        item.shuffledOrder = shuffleArray([...Array(item.words.length).keys()]);
        saveState();
      }
      
      // 按照保存的随机顺序渲染单词
      item.shuffledOrder.forEach(originalIndex => {
        const word = item.words[originalIndex];
        const isRevealed = item.revealed[originalIndex];
        
        const btn = document.createElement('span');
        btn.className = 'word-btn ' + (isRevealed ? 'revealed' : 'masked');
        btn.textContent = isRevealed ? word : '●●●';
        btn.dataset.tab = tab;
        btn.dataset.group = groupIndex;
        btn.dataset.word = originalIndex;
        
        btn.onclick = function(e) {
          if (!isRevealed) {
            revealWord(tab, groupIndex, originalIndex);
            // 选中文本需要在下一帧执行
            setTimeout(() => {
              const newBtn = document.querySelector(
                `.word-btn[data-tab="${tab}"][data-group="${groupIndex}"][data-word="${originalIndex}"]`
              );
              if (newBtn) selectElementText(newBtn);
            }, 0);
          } else {
            // 单击已展开的单词，选中文本
            selectElementText(btn);
          }
        };
        
        groupDiv.appendChild(btn);
      });
      
      // 如果所有单词都已显示，添加操作按钮
      if (allRevealed) {
        if (tab === 'default') {
          const completeBtn = document.createElement('button');
          completeBtn.className = 'action-btn complete';
          completeBtn.textContent = '完成';
          completeBtn.onclick = () => moveToComplete(tab, groupIndex);
          groupDiv.appendChild(completeBtn);
          
          const forgetBtn = document.createElement('button');
          forgetBtn.className = 'action-btn forget';
          forgetBtn.textContent = '忘记';
          forgetBtn.onclick = () => moveToForgotten(tab, groupIndex);
          groupDiv.appendChild(forgetBtn);
        } else if (tab === 'complete') {
          const backBtn = document.createElement('button');
          backBtn.className = 'action-btn forget';
          backBtn.textContent = '移回待复习';
          backBtn.onclick = () => moveToDefault(tab, groupIndex);
          groupDiv.appendChild(backBtn);
        } else if (tab === 'forgotten') {
          const backBtn = document.createElement('button');
          backBtn.className = 'action-btn complete';
          backBtn.textContent = '移回待复习';
          backBtn.onclick = () => moveToDefault(tab, groupIndex);
          groupDiv.appendChild(backBtn);
        }
      }
      
      return groupDiv;
    }

    /**
     * 渲染标签页内容
     * @param {string} tab - 标签页名称
     */
    function renderTab(tab) {
      const container = document.getElementById(`tab-${tab}`);
      container.innerHTML = '';
      
      if (state[tab].length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = tab === 'default' ? '🎉 没有待复习的单词！' 
                          : tab === 'complete' ? '还没有已完成的单词组'
                          : '还没有标记为忘记的单词组';
        container.appendChild(empty);
        return;
      }
      
      state[tab].forEach((item, index) => {
        container.appendChild(renderGroup(item, tab, index));
      });
    }

    /**
     * 更新计数器
     */
    function updateCounts() {
      document.getElementById('count-default').textContent = state.default.length;
      document.getElementById('count-complete').textContent = state.complete.length;
      document.getElementById('count-forgotten').textContent = state.forgotten.length;
    }

    /**
     * 主渲染函数
     */
    function render() {
      renderTab('default');
      renderTab('complete');
      renderTab('forgotten');
      updateCounts();
    }

    // ==================== Tab 切换 ====================

    function initTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.onclick = function() {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          
          this.classList.add('active');
          document.getElementById(`tab-${this.dataset.tab}`).classList.add('active');
        };
      });
    }

    // ==================== 单元测试 ====================

    function runTests() {
      const results = [];
      let passed = 0;
      let failed = 0;
      
      function assert(condition, testName) {
        if (condition) {
          results.push({ name: testName, pass: true });
          passed++;
        } else {
          results.push({ name: testName, pass: false });
          failed++;
        }
      }
      
      // 测试 shuffleArray
      const arr = [1, 2, 3, 4, 5];
      const shuffled = shuffleArray(arr);
      assert(shuffled.length === arr.length, 'shuffleArray: 长度保持不变');
      assert(shuffled.every(x => arr.includes(x)), 'shuffleArray: 包含所有原始元素');
      assert(arr.join(',') === '1,2,3,4,5', 'shuffleArray: 不修改原数组');
      
      // 测试 generateGroupKey
      const key1 = generateGroupKey(['apple', 'banana']);
      const key2 = generateGroupKey(['banana', 'apple']);
      assert(key1 === key2, 'generateGroupKey: 顺序无关');
      
      const key3 = generateGroupKey(['Apple', 'BANANA']);
      assert(key1 === key3, 'generateGroupKey: 大小写无关');
      
      // 测试 hasOverlap
      assert(hasOverlap(['a', 'b'], ['b', 'c']), 'hasOverlap: 有交集返回 true');
      assert(!hasOverlap(['a', 'b'], ['c', 'd']), 'hasOverlap: 无交集返回 false');
      assert(hasOverlap(['A'], ['a']), 'hasOverlap: 大小写无关');
      
      // 测试 createGroupItem
      const item = createGroupItem(['word1', 'word2'], 0, false);
      assert(item.words.length === 2, 'createGroupItem: words 长度正确');
      assert(item.revealed.length === 2, 'createGroupItem: revealed 长度正确');
      assert(item.revealed.every(r => r === false), 'createGroupItem: revealed 默认为 false');
      assert(item.originalIndex === 0, 'createGroupItem: originalIndex 正确');
      assert(item.isNew === false, 'createGroupItem: isNew 正确');
      assert(item.shuffledOrder && item.shuffledOrder.length === 2, 'createGroupItem: shuffledOrder 长度正确');
      assert([0, 1].every(x => item.shuffledOrder.includes(x)), 'createGroupItem: shuffledOrder 包含所有索引');
      
      // 测试 selectElementText
      const testSpan = document.createElement('span');
      testSpan.textContent = 'test word';
      document.body.appendChild(testSpan);
      selectElementText(testSpan);
      const selection = window.getSelection();
      assert(selection.toString() === 'test word', 'selectElementText: 正确选中文本');
      document.body.removeChild(testSpan);
      selection.removeAllRanges();
      
      // 测试 hideAllWords 功能
      const originalState = JSON.parse(JSON.stringify(state));
      if (state.default.length > 0) {
        state.default[0].revealed = state.default[0].words.map(() => true);
        const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
        if (activeTab === 'default') {
          hideAllWords();
          assert(state.default[0].revealed.every(r => r === false), 'hideAllWords: 所有单词被隐藏');
        }
      }
      state = originalState;
      
      // 显示结果
      const resultsDiv = document.getElementById('test-results');
      resultsDiv.innerHTML = `
        <h3>测试结果: ${passed} 通过, ${failed} 失败</h3>
        <ul>
          ${results.map(r => `
            <li class="${r.pass ? 'test-pass' : 'test-fail'}">
              ${r.pass ? '✅' : '❌'} ${r.name}
            </li>
          `).join('')}
        </ul>
      `;
      resultsDiv.classList.add('show');
    }

    // ==================== 初始化 ====================

    function init() {
      state = loadState();
      
      // 如果是首次加载（state 为空），初始化所有组
      if (state.default.length === 0 && state.complete.length === 0 && state.forgotten.length === 0) {
        state.default = defaultWordGroups.map((group, index) => createGroupItem(group, index, false));
        saveState();
      }
      
      // 同步 defaultWordGroups 的变化
      syncWithDefaultGroups();
      
      // 每次加载时，对于全部隐藏的组重新打乱顺序
      [...state.default, ...state.complete, ...state.forgotten].forEach(item => {
        const allHidden = item.revealed.every(r => !r);
        if (allHidden) {
          item.shuffledOrder = shuffleArray([...Array(item.words.length).keys()]);
        }
      });
      // 不在这里保存 - 打乱的顺序只在用户操作时才保存
      
      initTabs();
      render();
    }

    init();
  </script>
</body>
</html>
